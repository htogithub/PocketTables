<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketTables</title>
<meta name="description" content="Apprendre les tables de multiplication jusqu’au réflexe, et s’entraîner au calcul mental.">
<meta name="theme-color" content="#F1F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PocketTables">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root {
  --bg: #F1F2F5; --surface: #FFFFFF; --ink: #171A24; --muted: #6B7180; --faint: #A3A8B5;
  --line: #DDE0E7; --cell: #E3E5EB; --press: rgba(23, 26, 36, .05);
  --accent: #474CB8; --on-accent: #FFFFFF; --bad: #C23B4E;
  --serif: "STIX Two Text", ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141B; --surface: #1B1E28; --ink: #E8EAF0; --muted: #8E94A5; --faint: #5F6578;
    --line: #2A2E3B; --cell: #232733; --press: rgba(232, 234, 240, .06);
    --accent: #969BF6; --on-accent: #12141B; --bad: #F07C8C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141B; --surface: #1B1E28; --ink: #E8EAF0; --muted: #8E94A5; --faint: #5F6578;
  --line: #2A2E3B; --cell: #232733; --press: rgba(232, 234, 240, .06);
  --accent: #969BF6; --on-accent: #12141B; --bad: #F07C8C;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
body { overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; }

.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px);
  -webkit-overflow-scrolling: touch; will-change: transform;
}
.inner { max-width: 560px; margin: 0 auto; }

/* barre du haut */
.top { display: flex; align-items: center; justify-content: space-between; height: 48px; margin: 0 -10px; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; color: var(--ink); }
.icon:active { background: var(--press); }
.icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wordmark { font: 600 17px/1 var(--sans); letter-spacing: -.01em; padding-left: 10px; }
.wordmark i { font: italic 400 19px/1 var(--serif); color: var(--accent); margin: 0 1px; }
.title { font: 650 32px/1.1 var(--sans); letter-spacing: -.025em; margin: 6px 0 20px; }
.h2 { font: 600 13px/1.3 var(--sans); color: var(--muted); margin: 30px 0 10px; letter-spacing: .01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 1.45; }

/* lignes de navigation */
.rows { border-top: 1px solid var(--line); }
.row {
  position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr auto; align-items: center;
  column-gap: 12px; row-gap: 3px; width: 100%; text-align: left; padding: 15px 0; border: 0; border-bottom: 1px solid var(--line);
  background: none;
}
.row::before { content: ""; position: absolute; inset: 0 -20px; background: var(--press); opacity: 0; z-index: -1; transition: opacity .15s; }
.row:active::before { opacity: 1; }
.row[disabled] { opacity: .45; pointer-events: none; }
.row-t { font: 600 17px/1.25 var(--sans); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.row-s { grid-column: 1; font-size: 14px; line-height: 1.4; color: var(--muted); }
.row-s.mx { font: 17px/1.3 var(--serif); color: var(--muted); font-variant-numeric: lining-nums; }
.chev { grid-column: 2; grid-row: 1 / span 3; color: var(--faint); display: grid; }
.chev svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.badge { font: 600 11px/1 var(--sans); color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); padding: 4px 7px; border-radius: 6px; }
.flag { font: 600 11px/1 var(--sans); color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); padding: 4px 7px; border-radius: 6px; }
.rec { grid-column: 1; font-size: 13px; color: var(--accent); font-weight: 600; }

/* accueil */
.hero { padding: 6px 0 26px; }
.hero-line { margin: 18px 0 8px; font-size: 15px; line-height: 1.45; color: var(--muted); }
.hero-line b { color: var(--ink); font-weight: 600; }

/* grille de maîtrise */
.hm { display: grid; grid-template-columns: 16px repeat(var(--n), 1fr); gap: 3px; width: 100%; }
.hm.dense { gap: 2px; grid-template-columns: 14px repeat(var(--n), 1fr); }
.hm .lab { font: 500 10px/1 var(--sans); color: var(--faint); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.hm.dense .lab { font-size: 8px; }
.hm .c { aspect-ratio: 1; border-radius: 4px; border: 0; padding: 0; background: var(--cell); min-width: 0; }
.hm.dense .c { border-radius: 2px; }
.l0 { --fill: color-mix(in srgb, var(--bad) 70%, var(--cell)); }
.l1 { --fill: color-mix(in srgb, var(--accent) 22%, var(--cell)); }
.l2 { --fill: color-mix(in srgb, var(--accent) 45%, var(--cell)); }
.l3 { --fill: color-mix(in srgb, var(--accent) 70%, var(--cell)); }
.l4 { --fill: var(--accent); }
.hm .c[class*=" l"]:not(.l-1) { background: var(--fill); }
.hm .c:active { transform: scale(.85); }
.hm.wave .c { animation: cellIn .55s var(--ease) both; animation-delay: calc(var(--d) * 20ms); }
@keyframes cellIn { from { transform: scale(.3); opacity: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--fill, var(--cell)); display: inline-block; }
.legend .ramp { gap: 2px; }

/* segments */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--cell); border-radius: 11px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; font: 600 14px/1 var(--sans); color: var(--muted); padding: 10px 4px; border-radius: 8px; transition: color .2s; }
.seg button[aria-selected="true"] { color: var(--ink); }
.seg-ind {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n)); border-radius: 8px;
  background: var(--surface); box-shadow: 0 1px 3px rgba(15, 18, 30, .1); transition: transform .32s var(--ease);
}

/* onglets */
.tabs { position: relative; margin-top: 18px; }
.tabs .rows { margin-top: 0 !important; }
.tabs .weak .h2 { margin-top: 6px; }
.tabs > .tab > .intro { margin-top: 4px; }
.tab[hidden] { display: none; }

/* leçons */
.lessons { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson { grid-template-columns: 30px 1fr auto; }
.lesson .num { grid-row: 1 / span 3; font: 18px/1 var(--serif); color: var(--faint); font-variant-numeric: lining-nums; align-self: start; padding-top: 2px; }
.lesson .row-t, .lesson .row-s, .lesson .mbar { grid-column: 2; }
.lesson .chev { grid-column: 3; }
.mbar { height: 3px; border-radius: 2px; background: var(--cell); overflow: hidden; margin-top: 6px; max-width: 160px; }
.mbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

.weak { padding: 4px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .fact {
  border: 0; border-radius: 9px; padding: 8px 11px; font: 17px/1 var(--serif); font-variant-numeric: lining-nums;
  background: var(--cell); color: var(--ink);
}
.fact[class*=" l"]:not(.l-1) { background: var(--fill); }
.fact.l4, .fact.l3 { color: var(--on-accent); }
.fact.l0 { color: var(--on-accent); }
.chip.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.inline { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.intro { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 16px; }

/* boutons */
.btn {
  display: block; width: 100%; height: 52px; border: 0; border-radius: 14px; font: 600 16px/1 var(--sans);
  background: var(--cell); color: var(--ink); transition: transform .12s, opacity .12s;
}
.btn:active { transform: scale(.98); opacity: .85; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.danger { background: none; color: var(--bad); }
.btn.link { background: none; color: var(--muted); font-weight: 500; height: 44px; }
.actions { display: grid; gap: 10px; margin-top: 22px; }
.actions.two { grid-template-columns: 1fr 1fr; }

/* leçon */
.prose p { font-size: 16px; line-height: 1.6; margin: 0 0 12px; max-width: 62ch; }
.ex {
  margin: 18px 0; padding: 4px 0 4px 18px; border-left: 2px solid var(--line); cursor: pointer; user-select: none; -webkit-user-select: none;
}
.ex-l { font: 24px/1.5 var(--serif); font-variant-numeric: lining-nums; }
.ex-l:first-child { color: var(--ink); }
.ex-l + .ex-l { color: var(--muted); font-size: 21px; }
.ex-l:last-of-type:not(:first-child) { color: var(--ink); }
.ex-l.hid { display: none; }
.ex-h { font-size: 13px; color: var(--faint); margin: 4px 0 0; }
.ex.done .ex-h { display: none; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }

/* séance */
.screen-session { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 4px) 0 0; overflow: hidden; }
.s-top { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 6px; height: 48px; max-width: 600px; width: 100%; margin: 0 auto; }
.bar { flex: 1; height: 3px; background: var(--cell); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .35s var(--ease); }
.count { font: 500 14px/1 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.count.big { font: 400 22px/1 var(--serif); color: var(--ink); }
.stage { user-select: none; -webkit-user-select: none; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 18px; touch-action: none; min-height: 0; }
.card { width: 100%; max-width: 560px; text-align: center; }
.title-s { font-size: 13px; color: var(--faint); margin: 0 0 18px; min-height: 1em; }
.expr {
  font-family: var(--serif); font-size: clamp(42px, 14vw, 68px); line-height: 1.2; white-space: nowrap;
  font-variant-numeric: lining-nums; letter-spacing: -.01em;
}
.expr .op { color: var(--muted); margin: 0 .2em; }
.expr .op.mod { font-style: italic; font-size: .8em; }
.expr sup { font-size: .55em; line-height: 0; vertical-align: .85em; margin-left: .03em; }
.expr.stack .q { white-space: nowrap; }
.expr.stack .aline { margin-top: .2em; }
.slot {
  display: inline-block; min-width: 2.2ch; padding: 0 .1em; border-bottom: 2px solid var(--line);
  text-align: center; line-height: 1.12; position: relative; transition: color .15s, border-color .15s;
}
.expr.stack .slot { min-width: 3ch; }
.slot .ghost { color: var(--faint); }
.slot.ok { color: var(--accent); border-color: var(--accent); }
.slot.bad { color: var(--bad); border-color: var(--bad); }
.slot.reveal { color: var(--accent); border-color: transparent; }
.caret {
  display: inline-block; width: 2px; height: .82em; background: var(--accent); vertical-align: -.06em; margin-left: 1px;
  animation: blink 1.05s steps(1) infinite; border-radius: 1px;
}
@keyframes blink { 50% { opacity: 0; } }
.sub { font-size: 13px; color: var(--muted); margin-top: 14px; min-height: 0; }
.sub:empty { display: none; }
.note { min-height: 5.2em; margin: 22px auto 0; max-width: 34ch; font-size: 15px; line-height: 1.45; color: var(--muted); }
.note .t { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.note .m { display: block; font: 20px/1.4 var(--serif); color: var(--ink); font-variant-numeric: lining-nums; }
.note .m + .m { margin-top: 2px; }
.note .you { display: block; margin-bottom: 8px; color: var(--bad); }
.note .you s { text-decoration-thickness: 1.5px; }
.note .do { display: block; margin-top: 8px; font-size: 13px; color: var(--faint); }
.ghint { font-size: 12px; color: var(--faint); margin: 10px 0 0; text-align: center; min-height: 1.2em; }

.pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; max-width: 420px; margin: 0 auto;
  padding: 6px 14px calc(env(safe-area-inset-bottom, 0px) + 12px); user-select: none; -webkit-user-select: none; touch-action: none;
}
.key {
  height: 62px; border: 0; border-radius: 18px; background: transparent; color: var(--ink);
  font: 300 30px/1 var(--sans); font-variant-numeric: tabular-nums; display: grid; place-items: center;
  transition: background .18s, transform .18s; -webkit-touch-callout: none;
}
.key.down { background: var(--cell); transform: scale(.94); transition: none; }
.key svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.key.ok { color: var(--accent); }
.key.del { color: var(--muted); }
.cont { width: 100%; max-width: 420px; margin: 0 auto; padding: 6px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.cont[hidden], .pad[hidden] { display: none; }

/* calcul mental */
.mrow { position: relative; }
.mrow .row { grid-template-columns: 1fr 40px auto; }
.mrow .row .chev { grid-column: 3; }
.mrow .stat { font-size: 13px; }
.tipbtn { position: absolute; top: 50%; right: 22px; transform: translateY(-50%); color: var(--faint); }

/* bilan de séance */
.sum-title { font-size: 15px; color: var(--muted); margin: 8px 0 0; }
.sum-score { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 6px; font-family: var(--serif); }
.sum-score .big { font-size: 88px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: lining-nums; }
.sum-score .of { font-size: 26px; color: var(--muted); }
.sum-line { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 14px; }
.errs { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.errs li { padding: 14px 0; border-bottom: 1px solid var(--line); }
.e-q { font: 22px/1.3 var(--serif); font-variant-numeric: lining-nums; }
.e-q sup { font-size: .6em; }
.e-t { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.e-t b { color: var(--ink); font-weight: 600; }
.e-steps { margin-top: 6px; font: 17px/1.5 var(--serif); color: var(--muted); }

/* réglages */
.set { display: grid; gap: 8px; margin: 0 0 18px; }
.set-l { font-size: 15px; font-weight: 600; }
.set-help { font-size: 13px; line-height: 1.5; color: var(--muted); margin: -8px 0 18px; }

/* feuilles */
.backdrop { position: fixed; inset: 0; background: rgba(8, 10, 18, .36); z-index: 50; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 51;
  background: var(--surface); border-radius: 22px 22px 0 0; max-height: 86vh; overflow-y: auto;
  padding: 10px 22px calc(env(safe-area-inset-bottom, 0px) + 22px); box-shadow: 0 -8px 40px rgba(8, 10, 18, .18);
}
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
.sheet h3 { font: 650 22px/1.2 var(--sans); letter-spacing: -.02em; margin: 0 0 14px; }
.fs-expr { font: 46px/1.15 var(--serif); font-variant-numeric: lining-nums; margin: 4px 0 6px; }
.fs-lv { font-size: 13px; font-weight: 600; margin: 0 0 16px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.fs-lv i { width: 10px; height: 10px; border-radius: 3px; background: var(--fill, var(--cell)); }
.fs-tip .t { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.fs-tip .m { display: block; font: 21px/1.4 var(--serif); font-variant-numeric: lining-nums; }
.fs-stats { font-size: 14px; line-height: 1.5; color: var(--muted); }
.tips dt { font-weight: 600; font-size: 15px; margin-top: 16px; }
.tips dd { margin: 4px 0 0; font: 18px/1.5 var(--serif); color: var(--ink); font-variant-numeric: lining-nums; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
.pick button { border: 0; border-radius: 14px; background: var(--cell); padding: 14px 0 12px; display: grid; gap: 8px; justify-items: center; }
.pick button:active { transform: scale(.95); }
.pick b { font: 400 26px/1 var(--serif); font-variant-numeric: lining-nums; }
.pick .mbar { width: 60%; margin: 0; background: color-mix(in srgb, var(--ink) 9%, transparent); }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 500; white-space: nowrap;
}

/* méthode */
.method h2 { font: 600 18px/1.3 var(--sans); margin: 28px 0 8px; letter-spacing: -.01em; }
.method p { font-size: 16px; line-height: 1.6; margin: 0 0 10px; max-width: 62ch; }
.method .ref { font-size: 13px; color: var(--muted); }

@media (min-width: 700px) {
  .screen { padding-left: 32px; padding-right: 32px; }
  .key { height: 66px; }
}
@media (hover: hover) {
  .key:hover { background: var(--press); }
  .row:hover::before { opacity: .6; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .caret { animation: none; }
}

</style>
</head>
<body>
<main id="app"></main>
<noscript><p style="padding:24px">PocketTables a besoin de JavaScript.</p></noscript>
<script>
'use strict';
/* ================= PocketTables · logique pure ================= */
const DAY = 864e5, MIN = 6e4;
// Intervalles de Leitner par niveau (boîte 0 à 5)
const INTERVALS = [0, 10 * MIN, DAY, 3 * DAY, 7 * DAY, 21 * DAY];
const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).replace(/\d/g, d => SUPS[d]);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const group = s => (s.length >= 5 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F') : s);
const F = n => (n < 0 ? '−' : '') + group(String(Math.abs(n)));

/* ---------- état ---------- */
const STORE_KEY = 'pockettables.v1';
function defaultState() {
  return {
    v: 1,
    settings: { max: 12, thr: 3, len: 20, auto: true, theme: 'auto', level: 1 },
    facts: {}, mental: {}, sprint: {}, flags: {},
  };
}
function migrate(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  return {
    ...d, ...s,
    settings: { ...d.settings, ...(s.settings || {}) },
    facts: s.facts || {}, mental: s.mental || {}, sprint: s.sprint || {}, flags: s.flags || {},
  };
}

/* ---------- faits ---------- */
const fkey = (a, b) => (a <= b ? a + 'x' + b : b + 'x' + a);
const fparse = k => k.split('x').map(Number);
function factKeys(max) {
  const r = [];
  for (let a = 2; a <= max; a++) for (let b = a; b <= max; b++) r.push(fkey(a, b));
  return r;
}
function thrMs(st, a, b) {

const stack = [];

function render(entry, dir) {
  const app = document.getElementById('app');

  const el = document.createElement('section');
  el.className = 'screen cur screen-' + entry.name;

    anim(el, [{ opacity: 0 }, { opacity: 1 }], 200);
    return anim(old, [{ opacity: 1 }, { opacity: 0 }], 160, 'forwards').finished.then(done);

    anim(old, [{ transform: 'none' }, { transform: 'translateX(100%)' }], 320, 'forwards').finished.then(done);

/* ---------- feuilles ---------- */
let sheet = null;
function openSheet(html, mount) {
  closeSheet(true);
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = `<div class="grab"></div>${html}`;
  document.body.append(bd, sh);
  anim(bd, [{ opacity: 0 }, { opacity: 1 }], 220);
  anim(sh, [{ transform: 'translateY(100%)' }, { transform: 'none' }], 360);
  bd.addEventListener('click', () => closeSheet());
  sheet = { bd, sh };
  if (mount) mount(sh);
  requestAnimationFrame(() => { if (sh.scrollHeight <= sh.clientHeight + 1) sh.style.touchAction = 'none'; });
  dragToClose(sh);
  const f = sh.querySelector('button'); if (f && matchMedia('(hover: hover)').matches) f.focus({ preventScroll: true });
}
function closeSheet(instant) {
  if (!sheet) return;
  const { bd, sh } = sheet; sheet = null;
  if (instant) { bd.remove(); sh.remove(); return; }
  const cur = getComputedStyle(sh).transform;
  anim(bd, [{ opacity: 1 }, { opacity: 0 }], 220, 'forwards').finished.then(() => bd.remove());
  anim(sh, [{ transform: cur === 'none' ? 'none' : cur }, { transform: 'translateY(100%)' }], 260, 'forwards').finished.then(() => sh.remove());
}
function dragToClose(sh) {
  let y0 = null, dy = 0;
  sh.addEventListener('pointerdown', e => {
    if (e.button || sh.scrollTop > 0 || e.target.closest('button, a, input, details')) return;
    if (sh.style.touchAction !== 'none' && e.clientY - sh.getBoundingClientRect().top > 44) return;
    y0 = e.clientY; dy = 0; sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => {
    if (y0 === null) return; y0 = null;
    if (dy > 90) { closeSheet(); return; }
    sh.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; sh.style.transform = '';
    setTimeout(() => { sh.style.transition = ''; }, 260);
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
}

/* ---------- séance ---------- */
function factItem(k, form = 'mul') {
  let [a, b] = fparse(k);
  if (Math.random() < 0.5) [a, b] = [b, a];
  const p = a * b;
  let q, ans;
  if (form === 'missR') { q = `${a} × ${SLOT} = ${p}`; ans = b; }
  else if (form === 'missL') { q = `${SLOT} × ${b} = ${p}`; ans = a; }
  else if (form === 'div') { q = `${p} ÷ ${a} = ${SLOT}`; ans = b; }
  else { q = `${a} × ${b} = ${SLOT}`; ans = p; }
  return { kind: 'fact', k, a, b, form, q, ans, tip: strategy(a, b) };
}
function makeSession(cfg) {
  const ses = { title: '', queue: [], gen: null, total: 0, retype: true, requeue: true, timed: 0 };
  const items = keys => keys.map(k => factItem(k));
  switch (cfg.type) {
    case 'adaptive': ses.title = 'Adaptatif'; ses.queue = items(buildAdaptive(S)); break;
    case 'diag': ses.title = 'Bilan'; ses.queue = items(shuffle(factKeys(S.settings.max).filter(k => !seenF(S, k)))); ses.requeue = false; break;
    case 'table': ses.title = `Table de ${cfg.n}`; ses.queue = items(buildTable(S, cfg.n)); break;
    case 'family': ses.title = 'Familles'; ses.queue = buildFamily(S).map(x => factItem(x.k, x.form)); break;
    case 'weak': ses.title = 'Points faibles'; ses.queue = items(buildWeak(S)); break;
    case 'lesson': {
      const L = LESSONS.find(l => l.id === cfg.id);
      ses.title = L.title; ses.label = 'Exercice guidé';
      ses.queue = items(shuffle(lessonKeys(L, S.settings.max)).slice(0, 10));
      const half = Math.ceil(ses.queue.length / 2);
      ses.queue.forEach((it, i) => { if (i < half) it.study = true; });
      break;
    }
    case 'sprint': {
      ses.title = 'Sprint 60 s'; ses.timed = 60; ses.retype = false; ses.requeue = false;
      const keys = factKeys(S.settings.max); let last = null;
      ses.gen = () => { let k; do k = pick(keys); while (k === last && keys.length > 1); last = k; return factItem(k); };
      break;
    }
    case 'mental': {
      ses.title = CATS.find(c => c.id === cfg.cat).name + ['', ', facile', ', moyen', ', difficile'][cfg.lv];
      ses.retype = false; ses.requeue = false; ses.total = S.settings.len;
      ses.gen = () => genMental(cfg.cat, cfg.lv);
      break;
    }
  }
  if (!ses.gen) ses.total = ses.queue.length;
  return ses;
}

  }
  const showGestureHint = (S.flags.gh || 0) < 3;
  if (showGestureHint) { S.flags.gh = (S.flags.gh || 0) + 1; save(); }
  el.innerHTML = `
    <div class="s-top"><button class="icon" data-act="quit" aria-label="Terminer la séance">${I.close}</button><div class="bar" aria-hidden="true"><i></i></div><span class="count" aria-live="polite"></span></div>
    <div class="stage"><div class="card"><p class="title-s">${ses.label || ses.title}</p><div class="expr" aria-live="polite"></div><div class="sub"></div><div class="note" aria-live="polite"></div></div>
      <p class="ghint">${showGestureHint ? gestureHint(ses) : ''}</p></div>
    <div class="pad">${padHTML()}</div>
    <div class="cont" hidden><button class="btn primary" data-act="next">Continuer</button></div>`;
  const $ = s => el.querySelector(s);
  const expr = $('.expr'), note = $('.note'), sub = $('.sub'), card = $('.card'), stage = $('.stage'), bar = $('.bar i'), count = $('.count'), pad = $('.pad'), cont = $('.cont');
  let item = null, input = '', phase = 'idle', t0 = 0, aided = false, done = 0, score = 0, endAt = 0, timer = 0;
  const results = [], newReflex = new Set(), requeued = {};
  const slot = () => expr.querySelector('.slot');

  function renderSlot() {
    const s = slot(); if (!s) return;
    const caret = phase === 'answer' || phase === 'fix' ? '<i class="caret"></i>' : '';
    if (!input && phase === 'fix') s.innerHTML = caret + `<span class="ghost">${F(item.ans)}</span>`;
    else s.innerHTML = `<span>${group(input)}</span>` + caret;
  }
  function fit() {
    const target = expr.classList.contains('stack') ? expr.querySelector('.q') : expr;
    const maxW = card.clientWidth;
    if (!maxW) return;
    let size = parseFloat(getComputedStyle(expr).fontSize), guard = 0;
    const lineW = () => Math.max(target.scrollWidth, expr.classList.contains('stack') ? expr.querySelector('.aline').scrollWidth : 0);
    while (lineW() > maxW && size > 22 && guard++ < 40) { size -= 2; expr.style.fontSize = size + 'px'; }
  }
  function progress() {
    if (ses.timed) { count.textContent = String(score); return; }
    const total = ses.gen ? ses.total : done + ses.queue.length + (phase === 'done' ? 0 : 1);
    bar.style.width = `${(done / total) * 100}%`;
    count.textContent = `${Math.min(done + 1, total)}/${total}`;
  }
  function show(it, first) {
    item = it; input = ''; aided = false; phase = 'answer';
    const stack = it.kind === 'mental';
    expr.className = 'expr' + (stack ? ' stack' : '');
    expr.style.fontSize = '';
    expr.innerHTML = stack ? `<div class="q">${exprHTML(it.q)}</div><div class="aline"><span class="slot"></span></div>` : exprHTML(it.q);
    sub.textContent = it.sub || '';
    note.innerHTML = it.study ? tipHTML(it) : '';
    renderSlot(); fit();
    pad.hidden = false; cont.hidden = true;
    progress();
    if (!first) anim(card, [{ opacity: 0, transform: 'translateX(32px)' }, { opacity: 1, transform: 'none' }], 280);
    t0 = performance.now();
  }
  function nextItem() {
    if (phase === 'done') return;
    if (ses.timed && performance.now() >= endAt) return finish();
    let it;
    if (ses.gen) { if (ses.total && done >= ses.total) return finish(); it = ses.gen(); }
    else it = ses.queue.shift();
    if (!it) return finish();
    show(it);
  }
  function requeue(it) {
    const c = requeued[it.k] || 0;
    if (c >= 2) return;
    requeued[it.k] = c + 1;
    ses.queue.splice(Math.min(ses.queue.length, 2 + Math.floor(Math.random() * 3)), 0, factItem(it.k, it.form));
  }
  function submit(skipped) {
    const ms = performance.now() - t0, s = slot();
    const ok = !skipped && input !== '' && Number(input) === item.ans;
    if (phase === 'fix') {
      if (ok) { phase = 'lock'; s.classList.add('ok'); renderSlot(); setTimeout(nextItem, 240); }
      else { shake(s); input = ''; setTimeout(renderSlot, 200); }
      return;
    }
    phase = 'lock';
    if (item.kind === 'fact' && !item.study) {
      const r = recordFact(S, item.k, ok, skipped ? null : ms, aided);
      if (r.after === 4 && r.before < 4) newReflex.add(item.k);
    } else if (item.kind === 'mental') recordMental(S, item.cat, item.lv, ok, skipped ? null : ms);
    save();
    done++; if (ok) score++;
    results.push({ it: item, ok, ms: skipped ? null : ms, input, aided });
    renderSlot();
    if (ok) {
      s.classList.add('ok'); pop(s);
      progress();
      setTimeout(nextItem, ses.timed ? 140 : aided || item.study ? 520 : 280);
      return;
    }
    s.classList.add('bad');
    if (!skipped) shake(s);
    if (item.kind === 'fact' && ses.requeue && !item.study) requeue(item);
    progress();
    if (ses.timed) {
      setTimeout(() => { s.className = 'slot reveal'; s.innerHTML = F(item.ans); }, 260);
      setTimeout(nextItem, 950);
      return;
    }
    const wrongInput = skipped ? '' : input;
    setTimeout(() => {
      if (phase === 'done') return;
      s.classList.remove('bad');
      if (ses.retype) {
        phase = 'fix'; input = '';
        const showDo = (S.flags.fx || 0) < 4; if (showDo) { S.flags.fx = (S.flags.fx || 0) + 1; save(); }
        note.innerHTML = tipHTML(item, true) + (showDo ? '<span class="do">Recopie la réponse pour continuer.</span>' : '');
        renderSlot();
      } else {
        phase = 'review';
        s.classList.add('reveal'); s.innerHTML = F(item.ans);
        note.innerHTML = stepsHTML(item, wrongInput);
        pad.hidden = true; cont.hidden = false;
        fit();
        if (matchMedia('(hover: hover)').matches) cont.querySelector('button').focus({ preventScroll: true });
      }
      anim(note, [{ opacity: 0 }, { opacity: 1 }], 220);
    }, skipped ? 60 : 430);
  }
  function press(k) {
    if (phase === 'review') { if (k === 'ok') nextItem(); return; }
    if (phase !== 'answer' && phase !== 'fix') return;
    if (k === 'del') { input = input.slice(0, -1); renderSlot(); return; }
    if (k === 'ok') { if (input) submit(false); return; }
    if (input.length >= 9) return;
    input += k; renderSlot(); fit();
    if (S.settings.auto && input.length >= String(item.ans).length) submit(false);
  }
  function hint() {
    if (phase !== 'answer' || aided || item.study || ses.timed) return;
    aided = true;
    note.innerHTML = tipHTML(item, false);
    anim(note, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], 240);
  }
  function skip() { if (phase === 'answer') { input = ''; submit(true); } }
  function finish() {
    if (phase === 'done') return;
    phase = 'done'; clearTimeout(timer);
    const res = { cfg, title: ses.title, timed: ses.timed, score, done, results, newReflex: [...newReflex] };
    if (ses.timed) {
      const key = String(S.settings.max), prev = S.sprint[key] || 0;
      res.best = Math.max(prev, score); res.record = score > prev && prev > 0; res.first = !prev;
      S.sprint[key] = res.best; save();
    }
    go('summary', res, { replace: true });
  }
  function quit() {
    if (phase === 'done') return;
    if (!ses.timed && done >= 3) finish();
    else { phase = 'done'; clearTimeout(timer); back(); }
  }

  // clavier tactile : réaction au toucher, sans attendre le relâchement
  pad.addEventListener('pointerdown', e => {
    const k = e.target.closest('.key'); if (!k) return;
    e.preventDefault();
    k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 110);
    press(k.dataset.k);
  });
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'quit') quit();
    if (a.dataset.act === 'next') nextItem();
  });
  // gestes sur la carte
  let gx = null, gy = 0;
  stage.addEventListener('pointerdown', e => { if (phase !== 'answer' || e.button) return; gx = e.clientX; gy = e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (gx === null) return;
    const dx = e.clientX - gx, dy = e.clientY - gy;
    card.style.transform = `translate(${Math.min(0, dx) * 0.45}px, ${Math.min(0, dy) * 0.3}px)`;
    card.style.opacity = String(1 - Math.min(0.5, Math.abs(Math.min(0, dx)) / 400));
  });
  const gEnd = e => {
    if (gx === null) return;
    const dx = e.clientX - gx, dy = e.clientY - gy; gx = null;
    card.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s'; card.style.transform = ''; card.style.opacity = '';
    setTimeout(() => { card.style.transition = ''; }, 260);
    if (e.type === 'pointercancel') return;
    if (dx < -70 && Math.abs(dy) < 70) skip();
    else if (dy < -60 && Math.abs(dx) < 60) hint();
  };
  stage.addEventListener('pointerup', gEnd); stage.addEventListener('pointercancel', gEnd);
  // clavier physique
  const onKey = e => {
    if (sheet || e.metaKey || e.ctrlKey || e.altKey) return;
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key;
    else if (e.key === 'Backspace') k = 'del';
    else if (e.key === 'Enter') k = 'ok';
    else if (e.key === 'ArrowLeft') { skip(); return; }
    else if (e.key === 'ArrowUp') { hint(); return; }
    else if (e.key === 'Escape') { quit(); return; }
    if (!k) return;
    e.preventDefault();
    const btn = pad.querySelector(`[data-k="${k}"]`);
    if (btn && !pad.hidden) { btn.classList.add('down'); setTimeout(() => btn.classList.remove('down'), 110); }
    press(k);
  };
  document.addEventListener('keydown', onKey);
  el._cleanup = () => { document.removeEventListener('keydown', onKey); clearTimeout(timer); phase = 'done'; };

  if (ses.timed) {
    endAt = performance.now() + ses.timed * 1000 + 350;
    count.classList.add('big');
    bar.style.transition = 'none'; bar.style.width = '100%';
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${ses.timed}s linear`; bar.style.width = '0%'; }));
    timer = setTimeout(finish, ses.timed * 1000 + 350);
  }
  show(ses.gen ? ses.gen() : ses.queue.shift(), true);
};

/* ---------- bilan de séance ---------- */
VIEWS.summary = (el, r) => {
  const times = r.results.filter(x => x.ok && x.ms != null && !x.aided).map(x => x.ms).sort((a, b) => a - b);
  const med = times.length ? times[Math.floor(times.length / 2)] : null;
  const seen = new Set();
  const wrong = r.results.filter(x => !x.ok).filter(x => { const id = x.it.kind === 'fact' ? x.it.k : x.it.q; if (seen.has(id)) return false; seen.add(id); return true; });
  let head;
  const parts = [];
  if (r.timed) {
    head = `<span class="big">${r.score}</span><span class="of">en 60 s</span>`;
    parts.push(r.record ? `Nouveau record pour les tables jusqu’à ${S.settings.max}.` : r.first ? 'Premier score enregistré.' : `Ton record : ${r.best}.`);
  } else {
    head = `<span class="big">${r.score}</span><span class="of">sur ${r.done}</span>`;
    if (med) parts.push(`Temps médian : ${sec(med)}.`);
  }
  const nr = r.newReflex.length;
  if (nr) parts.push(`${nr} fait${nr > 1 ? 's' : ''} devenu${nr > 1 ? 's' : ''} réflexe${nr > 1 ? 's' : ''} :`);
  const line = parts.join(' ');
  const errItem = x => {
    const it = x.it;
    if (it.kind === 'fact') return `<li><div class="e-q">${it.a} × ${it.b} = ${F(it.a * it.b)}</div><div class="e-t"><b>${it.tip.title}</b> : ${it.tip.line}</div></li>`;
    return `<li><div class="e-q">${exprHTML(it.q).replace(/<span class="op[^"]*">([^<]*)<\/span>/g, ' $1 ')} = ${F(it.ans)}</div><div class="e-t">${x.input ? `Ta réponse : ${group(x.input)}. ` : ''}<b>${it.tip}</b></div><div class="e-steps">${it.steps.join('<br>')}</div></li>`;
  };
  el.innerHTML = `<div class="inner">
    <header class="top"><span></span><button class="icon" data-act="done" aria-label="Fermer">${I.close}</button></header>
    <p class="sum-title">${r.title}</p>
    <div class="sum-score">${head}</div>
    ${line ? `<p class="sum-line">${line}</p>` : ''}
    ${r.newReflex.length ? `<div class="chips">${r.newReflex.map(k => { const [a, b] = fparse(k); return `<button class="fact l4" data-k="${k}">${a} × ${b}</button>`; }).join('')}</div>` : ''}
    ${wrong.length ? `<h2 class="h2">À retenir</h2><ul class="errs">${wrong.map(errItem).join('')}</ul>` : r.done ? '<p class="sum-line">Aucune erreur.</p>' : ''}
    <div class="actions"><button class="btn primary" data-act="again">Recommencer</button><button class="btn" data-act="done">Terminer</button></div></div>`;
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'again') go('session', r.cfg, { replace: true });
    if (a.dataset.act === 'done') back();
  });
};

/* ---------- réglages ---------- */
VIEWS.settings = el => {
  const s = S.settings;
  const seg = (label, key, opts) => `<div class="set"><span class="set-l">${label}</span><div class="seg" style="--n:${opts.length}"><i class="seg-ind"></i>${opts.map(([v, t]) => `<button data-set="${key}" data-v="${v}" aria-selected="${String(s[key]) === String(v)}">${t}</button>`).join('')}</div></div>`;
  el.innerHTML = `<div class="inner">${topBar()}<h1 class="title">Réglages</h1>
    ${seg('Tables jusqu’à', 'max', [[10, '10'], [12, '12'], [20, '20']])}
    ${seg('Seuil réflexe', 'thr', [[2, '2 s'], [3, '3 s'], [4, '4 s']])}
    <p class="set-help">Un fait devient réflexe quand tu y réponds juste en moins de ce temps, plusieurs fois et à plusieurs jours d’écart. Au-delà de 12, chaque facteur ajoute 2 s.</p>
    ${seg('Questions par séance', 'len', [[10, '10'], [20, '20'], [30, '30']])}
    ${seg('Validation', 'auto', [[true, 'Automatique'], [false, 'Avec ✓']])}
    <p class="set-help">Automatique : la réponse est vérifiée dès qu’elle a le bon nombre de chiffres.</p>
    ${seg('Thème', 'theme', [['auto', 'Auto'], ['light', 'Clair'], ['dark', 'Sombre']])}
    <h2 class="h2">Progression</h2>
    <p class="set-help" style="margin-top:0">Elle est enregistrée sur cet appareil. Exporte-la pour la sauvegarder ou la transférer sur un autre appareil.</p>
    <div class="actions two" style="margin-top:0"><button class="btn" data-act="export">Exporter</button><button class="btn" data-act="import">Importer</button></div>
    <div class="actions"><button class="btn danger" data-act="reset">Effacer la progression</button><button class="btn link" data-go="method">Pourquoi cette méthode</button></div>
    <input type="file" accept="application/json,.json" hidden></div>`;
  el.querySelectorAll('.seg').forEach(syncSeg);
  const file = el.querySelector('input[type=file]');
  let resetArmed = 0;
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-set]');
    if (b) {
      const key = b.dataset.set, raw = b.dataset.v;
      s[key] = raw === 'true' ? true : raw === 'false' ? false : isNaN(+raw) ? raw : +raw;
      save();
      b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      syncSeg(b.parentElement);
      if (key === 'theme') applyTheme();
      if (key === 'max') firstHome = true;
      return;
    }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'export') exportData();
    if (a.dataset.act === 'import') file.click();
    if (a.dataset.act === 'reset') {
      if (Date.now() - resetArmed < 4000) {
        const keep = S.settings; S = defaultState(); S.settings = keep; save(); firstHome = true;
        a.textContent = 'Effacer la progression'; toast('Progression effacée.'); resetArmed = 0;
      } else {
        resetArmed = Date.now(); a.textContent = 'Toucher encore pour confirmer';
        setTimeout(() => { if (Date.now() - resetArmed >= 3900) a.textContent = 'Effacer la progression'; }, 4000);
      }
    }
  });
  file.addEventListener('change', async () => {
    const f = file.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || typeof data.facts !== 'object') throw new Error('format');
      S = migrate(data); save(); applyTheme(); firstHome = true;
      toast('Progression importée.'); rerender();
    } catch (err) { toast('Fichier illisible : choisis un export PocketTables (.json).'); }
    file.value = '';
  });
};
async function exportData() {
  const name = `pockettables-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  try {
    const f = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Progression PocketTables' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- méthode ---------- */
VIEWS.method = el => {
  el.innerHTML = `<div class="inner method">${topBar()}<h1 class="title">La méthode</h1>
    <p>Le but n’est pas de réciter les tables, mais que chaque produit sorte sans calcul, comme un mot qu’on lit. La recherche sur la mémoire et sur l’apprentissage des faits arithmétiques converge vers quelques principes, que l’app applique.</p>
    <h2>Comprendre avant de mémoriser</h2>
    <p>Les élèves qui retiennent le mieux les tables s’appuient d’abord sur des stratégies : doubler, passer par ×10, partir d’un carré. Ces stratégies rendent chaque fait reconstructible, puis la pratique les automatise. C’est l’ordre des leçons.</p>
    <p class="ref">Baroody, 2006 ; Baroody, Bajwa et Eiland, 2009.</p>
    <h2>Se tester plutôt que relire</h2>
    <p>Retrouver une réponse en mémoire la renforce bien plus que la relire. Chaque question te fait produire la réponse, sans choix multiple.</p>
    <p class="ref">Roediger et Karpicke, 2006.</p>
    <h2>Espacer les révisions</h2>
    <p>Chaque fait a un niveau, de 0 à 5. Une réponse juste et rapide le fait monter, une erreur le ramène à 0. Plus le niveau est haut, plus la révision suivante est lointaine : 10 minutes, 1 jour, 3 jours, une semaine, trois semaines. Tu revois donc souvent ce qui est fragile, rarement ce qui est acquis.</p>
    <p class="ref">Leitner, 1972 ; Cepeda et al., 2006.</p>
    <h2>Mélanger les tables</h2>
    <p>Réviser une table à la fois donne une impression de maîtrise trompeuse : on devine la suite. Mélanger oblige à reconnaître chaque fait pour lui-même. Le mode Une table existe pour cibler, mais l’entraînement adaptatif mélange toujours.</p>
    <p class="ref">Rohrer et Taylor, 2007.</p>
    <h2>Réussir souvent</h2>
    <p>Les faits nouveaux ou fragiles sont glissés entre des faits sûrs, environ un pour deux. Le taux de réussite reste élevé, ce qui garde la motivation et consolide les acquis.</p>
    <p class="ref">Burns, 2005, répétition incrémentale.</p>
    <h2>Corriger tout de suite</h2>
    <p>Après une erreur, la bonne réponse et sa stratégie s’affichent, et tu la recopies avant de continuer. Le fait revient quelques questions plus tard dans la même séance.</p>
    <p class="ref">Skinner, McLaughlin et Logan, 1997, méthode cover-copy-compare.</p>
    <h2>La vitesse comme mesure, pas comme pression</h2>
    <p>Un fait est réflexe quand la réponse est juste et arrive en moins de 3 secondes, de façon répétée. Le temps est mesuré en silence. Les tests chronométrés sont débattus, car l’anxiété mathématique occupe la mémoire de travail : le sprint reste donc facultatif, à faire quand les faits sont déjà sûrs.</p>
    <p class="ref">Ramirez et al., 2013 ; Boaler, 2014.</p>
    <h2>Les approches proposées</h2>
    <p><b>Leçons</b> : une stratégie expliquée, puis pratiquée avec l’aide affichée, puis sans. <b>Adaptatif</b> : la répétition espacée décide pour toi, c’est le mode à utiliser au quotidien. <b>Bilan</b> : pour situer rapidement ce que tu sais déjà. <b>Une table</b> et <b>Points faibles</b> : pour cibler. <b>Familles</b> : le même fait sous forme de produit, de facteur manquant et de division, pour relier ce qu’on sait. <b>Sprint</b> : pour mesurer ta fluidité.</p>
    <p>Quelques minutes par jour valent mieux qu’une longue séance par semaine.</p></div>`;
};

/* ================= démarrage ================= */
document.addEventListener('click', e => {
  if (!e.target.closest('#app')) return;
  const back_ = e.target.closest('[data-act="back"]'); if (back_) return back();
  const g = e.target.closest('[data-go]');
  if (g) { const params = g.dataset.id ? { id: g.dataset.id } : {}; return go(g.dataset.go, params); }
  const k = e.target.closest('[data-k]:not(.key)'); if (k) return factSheet(k.dataset.k);
  const t = e.target.closest('[data-table]'); if (t) return go('session', { type: 'table', n: +t.dataset.table });
});
// balayage depuis le bord gauche : retour
(() => {
  let x0 = null, y0 = 0;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX < 22 && stack.length > 1 && !sheet ? t.clientX : null; y0 = t.clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0); x0 = null;
    if (dx > 70 && dy < 80) {
      const cur = document.querySelector('.screen.cur');
      if (cur && cur.classList.contains('screen-session') && cur.querySelector('[data-act="quit"]')) cur.querySelector('[data-act="quit"]').click();
      else back();
    }
  }, { passive: true });
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

applyTheme();
stack.push({ name: 'home', params: {} });
history.replaceState({ d: 1 }, '');
render(stack[0], 'none');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
